[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./level" }]

[invariant]
runs = 32
depth = 50
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
